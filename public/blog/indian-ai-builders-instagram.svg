    <linearGradient id="card" x2="1" y2="1"><stop stop-color="#304e91"/><stop offset="1" stop-color="#192548"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#050b1e" flood-opacity=".48"/></filter>
