name: Sync build calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2,14 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh public build history
        run: node scripts/sync-build-calendar.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CALENDAR_MAX_PAGES: "20"
      - name: Publish updated calendar data
        run: |
          if git diff --quiet -- src/data/build-calendar.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/build-calendar.json
          git commit -m "Refresh public build calendar"
          git pull --rebase origin main
          git push origin HEAD:main
